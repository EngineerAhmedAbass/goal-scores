name: GOAL APK

on:
  push:
    branches: ['main']
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goal-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk GOAL-Scores.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GOAL-Scores-apk
          path: GOAL-Scores.apk

      # رابط ثابت لآخر نسخة: releases/latest/download/GOAL-Scores.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(( ${{ github.run_number }} + 100 ))
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest GOAL-Scores.apk \
            --target "${{ github.sha }}" \
            --latest \
            --title "GOAL — نتايج الماتشات (نسخة $V)" \
            --notes "نزّل GOAL-Scores.apk وسطّبه على الموبايل. أول مرة هيطلب منك مفتاح API-Football المجاني."
